<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>9个一组 · 试商小乐园</title>
<style>
:root{font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#243853;background:#f7f9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#e9f9f4,#eef3ff 60%,#fff7ea);min-height:100dvh;padding:16px}main{max-width:560px;margin:auto}h1{font-size:clamp(26px,7vw,34px);margin:8px 0 3px}h2{font-size:21px;margin:5px 0 12px}p{line-height:1.55}.muted{font-size:13px;color:#78879a}.card{background:white;padding:19px;border-radius:24px;box-shadow:0 12px 32px #506d9314;margin:14px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0 0}.tabs button{border:2px solid transparent;border-radius:14px;padding:12px 3px;background:#e5ebf5;color:#556985;font-weight:800;font-size:14px}.tabs button.active{background:#ddf7e9;border-color:#8dd8b6;color:#227858}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.chip{background:#f1f6ff;color:#496c9d;padding:6px 11px;border-radius:50px;font-size:13px;font-weight:750}.big{font-size:25px;font-weight:850;color:#284874;margin:10px 0}.action{border:0;background:#447fdd;color:#fff;padding:14px;border-radius:15px;font-size:17px;font-weight:800;width:100%;cursor:pointer;box-shadow:0 4px 0 #2c5cb7}.action:active{transform:translateY(2px);box-shadow:0 2px 0 #2c5cb7}.action:disabled{background:#bdcadc;box-shadow:none}.sub{border:0;background:#edf3ff;color:#456b9d;padding:11px 15px;border-radius:13px;font-size:14px;font-weight:750;cursor:pointer}.dots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0;min-height:34px}.dot{width:13px;height:13px;border-radius:50%;background:#f3b950;box-shadow:inset 0 -2px #d79827}.packs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-height:20px}.pack{border:2px solid #b8e7d1;background:#e5faf0;border-radius:15px;padding:8px 5px;text-align:center}.pack .dots{justify-content:center;gap:3px;margin:5px auto;max-width:68px}.pack .dot{width:12px;height:12px;background:#54b9a0;box-shadow:none}.pack small{font-size:11px;color:#36765d;font-weight:800}.remaining{border:2px dashed #efdbac;background:#fffcf4;border-radius:17px;padding:12px;margin:14px 0}.remaining strong{font-size:23px;color:#ae711e}.note{background:#e7f7ed;border-radius:15px;padding:13px;line-height:1.55;color:#26734e;margin-top:12px}.hint{background:#fff5d9;border-radius:14px;padding:12px;line-height:1.6;margin:10px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.choices button{border:2px solid #d4e2f5;background:#f7faff;color:#315782;border-radius:13px;padding:12px 5px;font-size:18px;font-weight:850;cursor:pointer}.choices button:active{background:#d7eaff}.track{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin:13px 0}.step{background:#dff2ff;border:1px solid #a2d1f4;border-radius:9px;padding:8px 6px;min-width:38px;text-align:center;font-size:13px;font-weight:800}.arrow{color:#8498aa}.hidden{display:none!important}.bar{height:23px;border-radius:30px;background:#e7eef8;overflow:hidden;margin:7px 0 12px}.fill{height:100%;background:#71c7a8;border-radius:30px;transition:width .2s}.feedback{color:#346e98;min-height:24px;margin:10px 0;font-size:15px;line-height:1.55}footer{font-size:12px;color:#8b99a8;text-align:center;margin:20px 0}button:focus-visible{outline:3px solid #eebf4f;outline-offset:2px}@media(max-width:380px){body{padding:12px}.card{padding:15px}.packs{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs button{font-size:12px}.dot{width:12px;height:12px}}</style>
</head><body><main>
<header><h1>🍡 9个一组</h1><div class="muted">先看见「里面有几个」，再学会试商</div></header>
<nav class="tabs" aria-label="小游戏选择"><button data-mode="0" class="active">📦 装满盒子</button><button data-mode="1">🐸 一跳9格</button><button data-mode="2">🔍 找合适的数</button></nav>
<section class="card"><div class="row"><span class="chip" id="count"></span><button id="switch" class="sub">换一道题 ↻</button></div><div class="big" id="question"></div><h2 id="instruction"></h2><div id="play"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="row"><button id="help" class="sub">💡 给我提示</button><button id="reset" class="sub">↺ 重新开始</button></div></section><footer>没有倒计时，也不扣分。慢慢试，错了也可以继续玩。<div style="margin-top:8px"><a href="./" style="color:#567db4">返回除法探险岛</a></div></footer>
</main><script>
(function(){
'use strict';
const problems=[[18,9],[27,9],[36,9],[45,9],[56,9],[64,9],[73,9],[82,9],[85,9],[72,8],[67,8],[74,8]];
let mode=0,index=6,used=0,choiceLocked=false;
const el=id=>document.getElementById(id);
function d(){let [n,k]=problems[index];return {n,k,q:Math.floor(n/k),r:n%k}}
function dots(n){let h='';for(let i=0;i<n;i++)h+='<span class="dot"></span>';return h}
function setFeedback(t,success){el('feedback').textContent=t;el('feedback').style.color=success?'#238462':'#346e98'}
function render(){let x=d();used=0;choiceLocked=false;document.querySelectorAll('[data-mode]').forEach((b,i)=>b.classList.toggle('active',i===mode));el('count').textContent='第 '+(index+1)+' / '+problems.length+' 题';el('question').textContent=x.n+' 里面有几个 '+x.k+'？';setFeedback('',false);
if(mode===0){el('instruction').textContent='把 '+x.n+' 颗小球，每 '+x.k+' 颗装一盒。';el('play').innerHTML='<div class="row"><b id="packed">已经装了 0 盒</b><span class="muted">每盒 '+x.k+' 颗</span></div><div class="packs" id="packs"></div><div class="remaining"><div class="row"><span>还没装的小球</span><strong id="leftNum">'+x.n+'</strong></div><div class="dots" id="loose">'+dots(x.n)+'</div></div><button class="action" id="packBtn">📦 装满一盒（拿走 '+x.k+' 颗）</button><div id="summary"></div>';el('packBtn').onclick=pack;
}else if(mode===1){el('instruction').textContent='小青蛙每次跳 '+x.k+' 格，不能跳过 '+x.n+'。';el('play').innerHTML='<div class="note" id="jumpText">现在在 0，一共跳了 0 次。</div><div id="track" class="track"><span class="step">0</span></div><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><button class="action" id="jumpBtn">🐸 再跳 '+x.k+' 格</button><div id="summary"></div>';el('jumpBtn').onclick=jump;
}else{el('instruction').textContent='哪一个乘积最接近 '+x.n+'，但不超过它？';let o=[Math.max(0,x.q-1),x.q,x.q+1];el('play').innerHTML='<div class="choices" id="choices"></div><div id="comparisons"></div><div id="summary"></div>';o.forEach(v=>{let b=document.createElement('button');b.textContent=x.k+' × '+v;b.onclick=()=>compare(v);el('choices').appendChild(b)});}}
function finished(){let x=d();el('summary').innerHTML='<div class="note">🎉 看到了！<b>'+x.n+' 里面有 '+x.q+' 个 '+x.k+'</b>，还剩 <b>'+x.r+'</b>。<br>'+x.k+' × '+x.q+' = '+x.q*x.k+'，再加 '+x.r+' 就是 '+x.n+'。</div>'}
function pack(){let x=d();if((used+1)*x.k>x.n)return;used++;let b=document.createElement('div');b.className='pack';b.innerHTML='<small>第 '+used+' 盒</small><div class="dots">'+dots(x.k)+'</div>';el('packs').appendChild(b);let left=x.n-used*x.k;el('packed').textContent='已经装了 '+used+' 盒';el('leftNum').textContent=left;el('loose').innerHTML=dots(left);if(left<x.k){el('packBtn').disabled=true;el('packBtn').textContent='✅ 不能再装满一盒了';setFeedback('因为只剩 '+left+' 颗，不够 '+x.k+' 颗。这就是「余数」！',true);finished()}else setFeedback('好！又装满一盒。现在还有 '+left+' 颗。',true)}
function jump(){let x=d();if((used+1)*x.k>x.n)return;used++;let pos=used*x.k;let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';let b=document.createElement('span');b.className='step';b.textContent=pos;el('track').append(arrow,b);el('fill').style.width=(pos/x.n*100)+'%';el('jumpText').textContent='现在跳到 '+pos+'，一共跳了 '+used+' 次。';let left=x.n-pos;if(left<x.k){el('jumpBtn').disabled=true;el('jumpBtn').textContent='✅ 再跳就超过终点了';setFeedback('还差 '+left+' 格，但每次必须跳 '+x.k+' 格。',true);finished()}else setFeedback('还可以继续往前跳。',true)}
function compare(v){if(choiceLocked)return;let x=d(),p=v*x.k;el('comparisons').innerHTML='<div class="hint">你选了 '+x.k+' × '+v+' = '+p+'。目标是 '+x.n+'。'+(p>x.n?'超过了 '+(p-x.n)+'，太大了！':p===x.n?'刚好等于目标！':'还剩 '+(x.n-p)+'。')+'</div>';if(v===x.q){choiceLocked=true;setFeedback('对！这是不会超过 '+x.n+' 的最大整数倍。',true);finished()}else setFeedback(v<x.q?'还能再多装一组。试大一点。':'一组也不能拆开，试小一点。')}
el('help').onclick=()=>{let x=d();let t=mode===0?'每次只拿走 '+x.k+' 颗，观察剩下的球有没有 '+x.k+' 颗。':mode===1?'从 0 开始一下一下跳，每次只加 '+x.k+'。':'比较 '+x.k+' × '+x.q+' 和 '+x.k+' × '+(x.q+1)+'，哪个不超过 '+x.n+'？';setFeedback('💡 '+t,false)};
el('reset').onclick=render;
el('switch').onclick=()=>{index=(index+1)%problems.length;render()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=Number(b.dataset.mode);render()});
render();
})();
</script></body></html>
