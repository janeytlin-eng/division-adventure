<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>除法探险岛 · 学习版</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:linear-gradient(160deg,#e8f9f0,#eff3ff 60%,#fff7e7);color:#233b56;font-family:ui-rounded,system-ui,sans-serif}main{max-width:510px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:8px 0 2px}h2{font-size:21px;margin:8px 0 12px}p{line-height:1.6}.muted{color:#78899a;font-size:13px}.score{background:white;border-radius:30px;padding:10px}.levels{display:flex;gap:6px;margin:18px 0}.levels span{flex:1;text-align:center;background:#dfe8ef;border-radius:12px;padding:10px 0}.levels .active{background:#b9edcc}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 32px #3c608015;margin:14px 0}.pill{display:inline-block;background:#e9f7ed;color:#277b58;border-radius:30px;padding:5px 12px;font-size:13px;font-weight:700}.problem{text-align:center;font-size:27px;font-weight:800;margin:18px 0}.division{display:flex;justify-content:center;align-items:flex-start;font-family:ui-monospace,monospace;font-size:28px;margin:16px auto 20px;width:max-content;max-width:100%}.divisor{padding:47px 10px 0 0}.stack{min-width:98px;text-align:right}.quotient{height:43px;padding-right:10px}.dividend{border-top:3px solid #345f8c;border-left:3px solid #345f8c;border-radius:5px 0 0 0;padding:7px 12px 6px 15px}.work{border-left:3px solid #345f8c;padding:4px 12px 4px 15px;font-size:18px;color:#537a9a}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}.choices button{border:2px solid #d8e4f5;background:#f6f9ff;color:#28517d;border-radius:15px;padding:15px 6px;font-size:19px;font-weight:800}.choices button:active{background:#d5e7ff}button{cursor:pointer}button.primary{width:100%;background:#477bd6;color:white;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:750}.secondary{background:transparent;border:0;color:#6885a0;padding:10px}.explain{background:#fff6dc;border-radius:14px;padding:13px;margin:12px 0;line-height:1.65}.ok{background:#e1f7e8}.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calc div{background:#f2f7ff;border-radius:14px;text-align:center;padding:14px 5px;font-size:18px}.hidden{display:none}input{width:100%;font-size:23px;border:2px solid #cfdeed;border-radius:14px;padding:12px;margin:8px 0 12px}.tiny{font-size:13px;color:#8190a2}#feedback{min-height:26px;color:#376d96;font-size:15px}footer{text-align:center;padding:15px;color:#8190a2;font-size:12px}</style><main><header><div><h1>🏝️ 除法探险岛</h1><div class="muted">不靠猜，学会一步一步算</div></div><div class="score" id="score">⭐ 0</div></header><div class="levels" id="levels"></div><section class="card"><span class="pill" id="badge">🌱 带着学</span><div class="problem" id="problem"></div><div id="vertical" class="division"></div><h2 id="title"></h2><div id="body"></div><div id="feedback" aria-live="polite"></div><button id="hint" class="secondary">💡 我需要一点提示</button><button id="next" class="primary hidden">继续 →</button></section><footer>每一步都可以慢慢来 · 答错也没关系</footer></main><script>
const tasks=[[120,20],[240,30],[168,24],[156,12],[315,35],[288,24],[384,16],[347,16],[473,21],[598,23],[763,27],[857,32]];const $=id=>document.getElementById(id);let state={i:0,stage:0,score:0};try{let x=JSON.parse(localStorage.getItem('divisionLearnV2'));if(x&&Number.isInteger(x.i)&&x.i>=0&&x.i<=tasks.length)state=x}catch(e){}let wrong=0;function save(){try{localStorage.setItem('divisionLearnV2',JSON.stringify(state))}catch(e){}}function task(){let[a,b]=tasks[Math.min(state.i,tasks.length-1)],q=Math.floor(a/b),r=a%b,t=Math.floor(b/10)*10,u=b%10;return{a,b,q,r,t,u}}function mode(){return state.i<4?0:state.i<8?1:2}function choice(values,answer,onRight){let area=document.createElement('div');area.className='choices';values.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===answer){wrong=0;$('feedback').textContent='✨ 找对啦！';onRight()}else{wrong++;$('feedback').textContent=v>answer?'这个数有点大，再试小一点。':'这个数还不够，再试大一点。';if(wrong>=2)$('feedback').textContent+=' 可以点提示。'}};area.appendChild(b)});$('body').appendChild(area)}function advance(){state.stage++;state.score+=10;save();render()}function draw(){let d=task(),show=state.stage>=1,showProduct=state.stage>=3;let q=show?d.q:'□';$('vertical').innerHTML='<div class="divisor">'+d.b+'</div><div class="stack"><div class="quotient">'+q+'</div><div class="dividend">'+d.a+'</div>'+(showProduct?'<div class="work">− '+d.b*d.q+'</div>':'')+(state.stage>=4?'<div class="work">余 '+d.r+'</div>':'')+'</div>'}function render(){if(state.i>=tasks.length){$('levels').textContent='🌟 🌟 🌟 🌟 🌟';$('problem').textContent='🏆 全部完成！';$('vertical').innerHTML='';$('title').textContent='你已经学会试商、拆乘法和验算啦！';$('body').innerHTML='';let b=document.createElement('button');b.className='primary';b.textContent='再玩一遍';b.onclick=()=>{state={i:0,stage:0,score:0};save();render()};$('body').appendChild(b);$('next').classList.add('hidden');$('hint').classList.add('hidden');return}let d=task(),m=mode();$('score').textContent='⭐ '+state.score;$('levels').innerHTML=Array.from({length:5},(_,i)=>'<span class="'+(Math.floor(state.i*5/tasks.length)===i?'active':'')+'">'+['🌱','🌿','⛰️','🌊','🏰'][i]+'</span>').join('');$('badge').textContent=['🌱 带着学','🌿 自己试','🌳 独立闯关'][m]+' · 第 '+(state.i+1)+' / '+tasks.length+' 题';$('problem').textContent=d.a+' ÷ '+d.b;draw();$('body').innerHTML='';$('feedback').textContent='';$('next').classList.add('hidden');$('hint').classList.remove('hidden');if(state.stage===0){$('title').textContent='第一步：找一个合适的商';let p=document.createElement('p');p.textContent=m===0?'不用马上猜！先比较几个乘积，看看哪一个最接近 '+d.a+'，又不超过它。':m===1?'先估计，再看看除数乘几最合适。':'试着独立找出商（整数部分）。';$('body').appendChild(p);let opts=[Math.max(0,d.q-1),d.q,d.q+1];if(m<2){let info=document.createElement('div');info.className='calc';info.innerHTML=opts.slice(0,2).map(v=>'<div>'+d.b+' × '+v+'<br><b>'+d.b*v+'</b></div>').join('');$('body').appendChild(info);choice(opts,d.q,advance)}else{numberInput(d.q,advance)}}else if(state.stage===1){$('title').textContent='第二步：乘法也能拆开算';let p=document.createElement('p');p.textContent='把 '+d.b+' 拆成 '+d.t+' 和 '+d.u+'。';$('body').appendChild(p);let c=document.createElement('div');c.className='calc';c.innerHTML='<div>'+d.t+' × '+d.q+'<br><b>'+d.t*d.q+'</b></div><div>'+d.u+' × '+d.q+'<br><b>'+d.u*d.q+'</b></div>';$('body').appendChild(c);let n=document.createElement('p');n.textContent='把这两部分加起来，得到多少？';$('body').appendChild(n);if(m===0)choice([d.b*d.q-d.q,d.b*d.q,d.b*d.q+d.q],d.b*d.q,advance);else numberInput(d.b*d.q,advance)}else if(state.stage===2){$('title').textContent='第三步：检查乘积有没有超过';let p=document.createElement('p');p.textContent=d.b+' × '+d.q+' = '+d.b*d.q+'。它有没有超过 '+d.a+'？';$('body').appendChild(p);choice(['超过了','没有超过','一样大'],d.r===0?'一样大':'没有超过',advance)}else if(state.stage===3){$('title').textContent='第四步：算出还剩多少';let p=document.createElement('p');p.textContent=d.a+' − '+d.b*d.q+' = ?';$('body').appendChild(p);if(m===0)choice([Math.max(0,d.r-1),d.r,d.r+1],d.r,advance);else numberInput(d.r,advance)}else{$('title').textContent='🎉 这一题完成了！';$('body').innerHTML='<div class="explain ok">'+d.a+' = '+d.b+' × '+d.q+' + '+d.r+'<br>商是 <b>'+d.q+'</b>，余数是 <b>'+d.r+'</b>。你做到了！</div>';$('hint').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=state.i===tasks.length-1?'领取奖杯 🏆':'下一题 →'}}function numberInput(answer,done){let input=document.createElement('input');input.type='number';input.inputMode='numeric';input.placeholder='输入你的答案';$('body').appendChild(input);let b=document.createElement('button');b.className='primary';b.textContent='检查答案';b.onclick=()=>{if(input.value.trim()!==''&&Number(input.value)===answer)done();else{$('feedback').textContent='先想一想，再试一次。也可以点提示。';wrong++}};$('body').appendChild(b);input.onkeydown=e=>{if(e.key==='Enter')b.click()}}$('hint').onclick=()=>{let d=task();let tips=['试试比较 '+d.b+' × '+Math.max(0,d.q-1)+' = '+d.b*Math.max(0,d.q-1)+' 和 '+d.b+' × '+d.q+' = '+d.b*d.q,'先算 '+d.t+' × '+d.q+' = '+d.t*d.q+'，再算 '+d.u+' × '+d.q+' = '+d.u*d.q,'乘积是 '+d.b*d.q+'，被除数是 '+d.a,'从 '+d.a+' 里面减去 '+d.b*d.q];$('feedback').textContent='💡 '+tips[Math.min(state.stage,3)]};$('next').onclick=()=>{state.i++;state.stage=0;wrong=0;save();render()};render();
</script></html>
