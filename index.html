<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>除法探险岛</title><style>body{font-family:system-ui,sans-serif;background:#eaf6ff;color:#173653;margin:0;padding:18px}main{max-width:620px;margin:auto}.card{background:white;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #1232}h1{margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.map{display:flex;gap:5px}.map span{flex:1;text-align:center;background:#dce8ee;border-radius:9px;padding:10px 0}.map .on{background:#a5ebc4}button{border:0;border-radius:12px;background:#277bd5;color:white;font-size:17px;font-weight:bold;padding:13px;cursor:pointer}button.alt{background:#e5f1fc;color:#236092}input{font-size:24px;width:100%;padding:12px;box-sizing:border-box;border:2px solid #a5c8e2;border-radius:12px}.buttons{display:flex;gap:10px;margin:12px 0}.buttons button{flex:1}.board{font-family:monospace;font-size:30px;text-align:center;line-height:1.5;white-space:pre-wrap}.green{color:#168b61}.muted{color:#648197}.hidden{display:none}.msg{min-height:35px;color:#146f95}label{display:block;margin:14px 0;font-size:19px;font-weight:650}</style><main><div class="row"><div><h1>🏝️ 除法探险岛</h1><div class="muted">一步一步学竖式，闯过五关！</div></div><b id="score">⭐ 0</b></div><div class="map" id="map"></div><section class="card" id="game"><div class="row"><b id="level"></b><span id="progress"></span></div><h2 id="question"></h2><div class="board" id="board"></div><label id="prompt" for="answer"></label><input id="answer" type="number" inputmode="numeric" placeholder="填写这一步的答案"><div class="buttons"><button id="check">检查答案 ✓</button><button class="alt" id="tip">💡 提示</button></div><div class="msg" id="msg" aria-live="polite"></div><div class="buttons"><button class="alt" id="reset">重做本题</button><button id="next" class="hidden">下一关 →</button></div></section><section id="win" class="card hidden" style="text-align:center"><div style="font-size:80px">🏆</div><h2>除法竖式小冠军！</h2><p id="result"></p><button id="again">再玩一次</button></section><p class="muted" style="text-align:center">在浏览器中玩 · 无需登录 · 自动尝试保存进度</p></main><script>
const bank=[[[168,24],[234,26],[315,35],[192,32]],[[156,12],[288,24],[364,28],[432,18]],[[157,12],[295,23],[347,16],[473,21]],[[384,16],[598,23],[672,28],[728,26]],[[895,34],[763,27],[936,39],[857,32]]],names=['🌱 新手森林','⛰️ 乘法山谷','🌊 余数河流','🧩 试商迷宫','🏰 冠军城堡'];const el=id=>document.getElementById(id);let s;try{s=JSON.parse(localStorage.getItem('divisionIsland'))}catch(e){}if(!s||!Number.isInteger(s.level)||s.level<0||s.level>5)s={level:0,step:0,score:0,picks:[],errors:0};function save(){try{localStorage.setItem('divisionIsland',JSON.stringify(s))}catch(e){}}function pick(){s.picks[s.level]=Math.floor(Math.random()*4);save()}if(s.level<5&&s.picks[s.level]==null)pick();function data(){let[a,b]=bank[s.level][s.picks[s.level]],f=+String(a).slice(0,2),two=f>=b,p=two?f:a,q1=Math.floor(p/b),m1=q1*b,r1=p-m1,down=r1*10+a%10,q2=Math.floor(down/b),m2=q2*b,q=Math.floor(a/b),r=a%b;let steps=two?[[q1,'试商：'+b+' 在 '+f+' 里能放几次？','想想除数乘几不超过前两位'],[m1,b+' × '+q1+' = ?','用商乘除数'],[r1,p+' − '+m1+' = ?','用前两位减去乘积'],[down,'把个位的 '+a%10+' 落下来，得到多少？','余数右边写上个位数字'],[q2,b+' 在 '+down+' 里能放几次？','找最大的合适整数'],[m2,b+' × '+q2+' = ?','除数乘个位商'],[r,down+' − '+m2+' = ?','最后的差是余数']]:[[q,b+' 在 '+a+' 里能放几次？','找最接近被除数的乘积'],[q*b,b+' × '+q+' = ?','除数乘商'],[r,a+' − '+q*b+' = ?','被除数减乘积']];return{a,b,two,q1,m1,r1,down,q2,m2,q,r,steps}}function render(){el('score').textContent='⭐ '+s.score;el('map').innerHTML=names.map((n,i)=>'<span class="'+(i===s.level?'on':'')+'">'+['🌱','⛰️','🌊','🧩','🏰'][i]+'<small style="display:block">'+(i<s.level?'✓':i>s.level?'🔒':'第'+(i+1)+'关')+'</small></span>').join('');if(s.level===5){el('game').classList.add('hidden');el('win').classList.remove('hidden');el('result').textContent='五关全部完成！获得 '+s.score+' 分';return}el('game').classList.remove('hidden');el('win').classList.add('hidden');let d=data(),n=s.step,done=n===d.steps.length;el('level').textContent=names[s.level];el('progress').textContent=done?'完成':(n+1)+' / '+d.steps.length;el('question').textContent=d.a+' ÷ '+d.b+' = ?';let lines=[(n>=1?(d.two?d.q1+(n>=5?''+d.q2:'□'):d.q):'□'),d.b+' ⟌ '+d.a];if(n>=2)lines.push('− '+d.m1);if(n>=3)lines.push('余 '+d.r1);if(d.two&&n>=4)lines.push('↓ '+d.down);if(d.two&&n>=6)lines.push('− '+d.m2);if(done)lines.push('余数 '+d.r);el('board').textContent=lines.join('\n');el('prompt').textContent=done?'🎉 答对了！验算：'+d.b+' × '+d.q+' + '+d.r+' = '+d.a:'第 '+(n+1)+' 步：'+d.steps[n][1];for(let id of ['answer','check','tip'])el(id).classList.toggle('hidden',done);el('next').classList.toggle('hidden',!done);el('next').textContent=s.level===4?'🏆 领取奖杯':'下一关 →';if(done)el('msg').textContent='这关完成啦！'}function check(){let d=data(),v=el('answer').value.trim();if(!/^\d+$/.test(v)){el('msg').textContent='请填写非负整数';return}if(+v===d.steps[s.step][0]){s.score+=s.errors?5:10;s.step++;s.errors=0;el('answer').value='';save();render();if(s.step<d.steps.length)el('msg').textContent='✨ 正确！继续下一步'}else{s.errors++;el('msg').textContent=s.errors>=3?'答案是 '+d.steps[s.step][0]+'，再填写一次吧！':'再想想：'+d.steps[s.step][2];save()}}el('check').onclick=check;el('answer').onkeydown=e=>{if(e.key==='Enter')check()};el('tip').onclick=()=>el('msg').textContent='💡 '+data().steps[s.step][2];el('reset').onclick=()=>{s.step=0;s.errors=0;el('answer').value='';el('msg').textContent='';save();render()};el('next').onclick=()=>{s.level++;s.step=0;s.errors=0;el('answer').value='';el('msg').textContent='';if(s.level<5)pick();save();render()};el('again').onclick=()=>{s={level:0,step:0,score:0,picks:[],errors:0};pick();render()};render();
</script></html>
